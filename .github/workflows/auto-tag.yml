# frontend/package.json 의 version 이 올라가면 태그를 만들고 릴리스까지 이어간다.
#
# 버전을 올리는 행위가 곧 "이걸 배포하겠다"는 결정이다. 버전을 올리지 않은 커밋은
# 릴리스를 만들지 않으므로, main 에 자유롭게 커밋하면서 배포 시점만 따로 정할 수
# 있다(52에서 검증된 방식).
#
# **CI 가 통과한 커밋에만 태그를 단다**(2026-10-16). 전에는 package.json 이 바뀐 푸시에서
# CI 와 나란히 돌아, v1.292.0 이 CI 빨강(새 설치가 마이그레이션에서 멈춤) 그대로 배포 패키지로
# 나갔다. 이제 main 푸시의 CI 가 끝나 통과하면 돌고, 그 커밋의 버전에 태그가 아직 없을 때만
# 태그를 단다 — 그래서 릴리스 커밋의 CI 가 빨개도, 고친 커밋의 CI 가 초록이 되는 순간 그 커밋에
# 태그가 붙는다(고친 코드로 패키지가 나간다). 태그가 이미 있으면 몇 초 만에 넘어간다.
#
# 릴리스를 **같은 실행 안에서** 호출한다. GitHub 은 GITHUB_TOKEN 이 만든 이벤트로
# 다른 워크플로를 트리거하지 않아서, 태그만 밀어 두면 release 워크플로가 영영 돌지
# 않는다(실측). PAT 없이 해결하는 방법이 workflow_call 이다.

name: Auto tag on version bump

on:
  workflow_run:
    workflows: ['CI - Windows']
    types: [completed]
    branches: [main, master]

# 초록 CI 둘이 겹쳐도 같은 태그를 두 번 밀지 않게 줄 세운다.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    # **main 푸시의 CI 가 통과했을 때만.** PR 의 CI 는 보지 않는다 — 합쳐지기 전 커밋이다.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      value: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v5
        with:
          # **CI 가 검사한 그 커밋이다** — 그사이 main 이 앞서 나가도 검사 안 된 커밋에 태그를
          # 달지 않는다.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 버전 읽기
        id: version
        run: echo "value=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 태그 생성 (이미 있으면 조용히 넘어간다)
        id: tag
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG 태그가 이미 있습니다 — 넘어갑니다."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: v${{ needs.tag.outputs.value }}
