# 검증 게이트.
#
# 65는 검증 로직이 정교한데 .github 이 아예 없어 서버 측 강제가 0이었고, 게이트가
# 로컬 git hook 전용이라 --no-verify 로 우회됐다. RA는 CI 인프라는 있는데 검증
# 스텝이 없었다. 여기서는 처음부터 양쪽을 붙인다(개발계획 §8).

name: CI - Windows

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    env:
      # conftest 가 여기서 <이름>_test 를 파생해 만든다. 개발 DB를 건드리지 않는
      # 구조가 CI에서도 그대로 성립한다.
      DATABASE_URL: postgresql+psycopg://postgres:root@localhost:5432/matnexus
      # 스모크가 쓰는 계정. CI 전용이라 값이 노출돼도 문제가 없다 —
      # 운영 비밀번호는 `seed_install.py` 가 자동 생성한다.
      SMOKE_PASSWORD: smoke-only-password-1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # windows 러너 이미지에는 PostgreSQL 이 설치돼 있지만 꺼져 있다.
      - name: PostgreSQL 시작
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql* | Select-Object -First 1
          Set-Service -InputObject $service -StartupType Automatic
          Start-Service -InputObject $service
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\pg_isready" --timeout=30

      - name: 백엔드 의존성
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 린트 (ruff)
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: 타입 (mypy strict)
        working-directory: backend
        run: python -m mypy

      # 계약 baseline·경계 검사·인증 흐름이 모두 여기서 돈다.
      - name: 테스트 (pytest)
        working-directory: backend
        run: python -m pytest

      - name: 프론트엔드 의존성
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 빌드 (tsc strict + vite)
        working-directory: frontend
        run: npm run build

      # 65의 재작업 44건이 이 축에서 나왔다(§8.5). 이 저장소도 같은 길을 가고
      # 있었다 — 최근 결함이 거의 전부 프론트였고 전부 사용자가 발견했다.
      # 모듈 경계 검사도 여기서 돈다(백엔드만 막고 있었다).
      - name: 프론트엔드 테스트 (vitest)
        working-directory: frontend
        run: npm test

      - name: 프론트엔드 린트 (oxlint)
        working-directory: frontend
        run: npm run lint

      # 스모크는 **진짜 서버·워커·DB** 를 거친다. jsdom 은 레이아웃 엔진이 없고
      # 서버가 전부 가짜라, "곡선이 저장됐는데 화면에 안 보인다" 같은 것을
      # 원리상 못 잡는다(실제로 놓쳤다).
      #
      # 배포와 같은 모양으로 돌린다 — 백엔드 한 프로세스가 SPA 까지 서빙하므로
      # 프록시가 끼지 않고 확인 대상이 하나 줄어든다.
      - name: 스모크 준비 (DB·계정)
        working-directory: backend
        shell: pwsh
        run: |
          # **DB 를 여기서 만든다.** pytest 는 `matnexus_test` 를 스스로 만들지만
          # 스모크는 개발과 같은 `matnexus` 를 쓴다. 개발 PC 에는 그 DB 가 이미
          # 있어서 이 단계가 빠진 것이 로컬에서는 보이지 않았다 — 스모크를 CI 에
          # 붙인 뒤 처음 돌린 여기서 드러났다.
          $env:PGPASSWORD = 'root'
          $exists = & "$env:PGBIN\psql" -U postgres -h localhost -tAc "SELECT 1 FROM pg_database WHERE datname='matnexus'"
          if ($exists -ne '1') { & "$env:PGBIN\createdb" -U postgres -h localhost matnexus }
          python -m alembic upgrade head
          python scripts/seed_install.py --password '${{ env.SMOKE_PASSWORD }}'
          python scripts/ensure_test_types.py

      - name: 서버·워커 기동
        working-directory: backend
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList 'run.py' -WindowStyle Hidden
          Start-Process -FilePath python -ArgumentList 'run_worker.py' -WindowStyle Hidden
          # 준비될 때까지 기다린다. 고정 sleep 은 느리거나 모자라거나 둘 중 하나다.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            try {
              if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8010/api/health).StatusCode -eq 200) {
                Write-Host '백엔드 준비됨'; exit 0
              }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          Write-Error '백엔드가 60초 안에 뜨지 않았습니다.'; exit 1

      - name: 브라우저 (playwright)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 스모크 (playwright)
        working-directory: frontend
        env:
          MNX_BASE_URL: http://127.0.0.1:8010
          MNX_ADMIN_EMAIL: admin@matnexus.local
          MNX_ADMIN_PASSWORD: ${{ env.SMOKE_PASSWORD }}
        run: npm run test:e2e

      # 실패했을 때 무슨 화면이었는지 남긴다. 스크린샷 픽셀 비교(시각 회귀)는
      # 일부러 안 한다 — 거짓 실패가 잦고, 그것이 반복되면 baseline 을 습관적으로
      # 갱신하게 되어 검사가 죽는다.
      - name: 실패 흔적 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-흔적
          path: frontend/test-results
          retention-days: 7

      # 생성 타입이 커밋된 것과 다르면 누군가 재생성을 빠뜨린 것이다(D13).
      - name: 생성 타입 최신성
        working-directory: frontend
        shell: pwsh
        run: |
          npm run api:types
          $diff = git diff --name-only -- src/shared/api/schema.d.ts
          if ($diff) {
            Write-Error "schema.d.ts 가 최신이 아닙니다. 'npm run api:types' 를 실행하고 커밋하세요."
            exit 1
          }
