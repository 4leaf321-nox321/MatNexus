[project]
name = "matnexus-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

# 의존성 정본은 requirements.txt 다. 배포 파이프라인이 `pip wheel -r
# requirements.txt` 로 wheel 번들을 만들고 서버는 --no-index 로 설치하기 때문에,
# 전이 의존성까지 고정된 파일이 하나 있어야 한다.

[tool.ruff]
line-length = 95
target-version = "py312"
# `scripts/` 는 그 자체가 import 뿌리다 — 스크립트를 직접 실행하면 그 폴더가
# sys.path[0] 이 되므로 이웃 모듈(`_console`)을 그냥 부를 수 있다. 여기 적지
# 않으면 isort 가 그것을 서드파티로 보아 엉뚱한 자리에 정렬한다.
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 물성의 표기다. `ν`(포아송비)를 `v` 로, `E′`(저장 탄성률)를 `E'` 로, `α`(Ogden
# 지수)를 `a` 로, `σ`(응력)를 `o` 로 적으면 읽는 사람이 다른 것으로 본다 — 여기서는
# 그 글자가 정답이다. 특히 `dσ/dε` 는 이 도메인에서 그렇게만 쓴다.
# ASCII 로 바꿔 쓸 수 있는 `×`·`−` 는 그대로 막아 둔다(그건 실제로 오타가 섞인다).
allowed-confusables = ["ν", "′", "″", "α", "σ"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 의존성 주입은 기본값 자리에 Depends()를 쓰는 것이 정식 문법이라
# B008(기본 인자에서 함수 호출)이 전부 오탐이 된다.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Alembic이 생성한 파일은 손으로 고치지 않는 한 그대로 둔다. 여기를 린트에
# 맞추려고 생성 결과를 매번 손보면, 정작 사람이 쓴 부분의 변경이 묻힌다.
"migrations/versions/*" = ["E501", "I001", "UP035", "UP007"]
# 어휘 정규화는 **전각·자모분해 같은 헷갈리는 문자 자체가 소재**다. 그것을
# "오타 아니냐" 고 묻는 검사와는 맞지 않는다 — 여기서는 그 문자가 정답이다.
"tests/api/test_vocabulary.py" = ["RUF001"]
# 문서를 생성하는 스크립트 — 문장이 곧 출력이라 줄을 자르면 문서가 잘린다.
"scripts/describe_extension_api.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "matcore", "tests"]
# `mcp_server` 는 별도 venv 라 여기서 import 를 못 푼다. 그쪽 순수 함수를 부르는
# 시험이 하나 있는데(`test_mcp_retry_plan`), 그 모듈에는 딸린 것이 없어 실행은 된다.
mypy_path = "../mcp_server"
plugins = []
# 서드파티 스텁이 없는 것만 개별 예외로 둔다. 전역 ignore는 두지 않는다.

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# pyarrow 는 py.typed 를 배포하지 않는다(25.x 기준). 곡선 직렬화 한 파일에서만 쓴다.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# scipy 도 스텁을 배포하지 않는다. 비선형 최소제곱 한 곳에서만 쓴다 —
# 경계 있는 적합을 직접 짜면 조용히 틀린 답에 수렴하는 쪽이 훨씬 위험하다.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# **워커 4개로 나눠 돈다** — 순차 186초가 102초다(2026-08-27 실측, 1,309건).
#
# `auto` 를 안 쓴다. 이 개발기는 32코어라 워커가 32개 뜨는데, 워커마다 엔진 풀을
# 지므로 PostgreSQL 의 `max_connections=100` 을 넘어 **연결 실패로 죽고 오히려
# 272초**가 됐다. 워커를 늘려도 6개에서 98초로 평평해진다 — 병목이 코어가 아니라
# DB 하나이기 때문이다. CI 러너는 4코어이므로 두 곳에서 같은 값이 맞다.
#
# 워커마다 DB 를 나눈다(`conftest._test_url`). 안 나누면 서로의 테이블을 비운다.
addopts = "-q -n 4"
