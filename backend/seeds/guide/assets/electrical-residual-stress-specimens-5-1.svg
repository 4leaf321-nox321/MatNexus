<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="홀드릴링 로제트와 증분 깊이, 그리고 잔류응력이 만족해야 하는 자기평형 조건" style="width:100%;height:auto;overflow:visible"><defs><marker id="el_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="el_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="26" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">잔류응력은 <tspan font-weight="600">외력이 0 인 상태로 존재</tspan>한다 — 그래서 스스로 평형이어야 한다</text><circle cx="170" cy="150" r="48.0" fill="none" stroke="#2F6FC4" stroke-width="1.2" stroke-dasharray="4 3"></circle><g transform="rotate(0 170.0 102.0)"><rect x="159.0" y="94.0" width="22" height="16" fill="#2F6FC4" fill-opacity=".35" stroke="#2F6FC4" stroke-width="1"></rect></g><g transform="rotate(-120 128.4 174.0)"><rect x="117.4" y="166.0" width="22" height="16" fill="#2F6FC4" fill-opacity=".35" stroke="#2F6FC4" stroke-width="1"></rect></g><g transform="rotate(-240 211.6 174.0)"><rect x="200.6" y="166.0" width="22" height="16" fill="#2F6FC4" fill-opacity=".35" stroke="#2F6FC4" stroke-width="1"></rect></g><circle cx="170" cy="150" r="19" fill="var(--bg,#EDEFEC)" stroke="#C4402B" stroke-width="2"></circle><line x1="151" y1="150" x2="189" y2="150" stroke="#C4402B" stroke-width="1" marker-start="url(#el_ah)" marker-end="url(#el_ah)"></line><text x="170" y="124" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#C4402B">D₀</text><line x1="122.0" y1="220.0" x2="218.0" y2="220.0" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#el_ah)" marker-end="url(#el_ah)"></line><text x="170" y="236.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">게이지 원 D</text><text x="170" y="260.0" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">Type A · D = 2.57 / 5.13 / 10.26 mm</text><text x="170" y="276.0" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">모서리에서 ≥ 1.5 D 떨어질 것</text><rect x="320" y="100" width="190" height="120" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".8" stroke-width="1.4"></rect><rect x="399.0" y="100" width="32" height="52" fill="var(--bg,#EDEFEC)" stroke="#C4402B" stroke-width="1.6"></rect><line x1="399.0" y1="110.4" x2="431.0" y2="110.4" stroke="#D07A3B" stroke-width="0.9" stroke-opacity=".7"></line><line x1="399.0" y1="120.8" x2="431.0" y2="120.8" stroke="#D07A3B" stroke-width="0.9" stroke-opacity=".7"></line><line x1="399.0" y1="131.2" x2="431.0" y2="131.2" stroke="#D07A3B" stroke-width="0.9" stroke-opacity=".7"></line><line x1="399.0" y1="141.6" x2="431.0" y2="141.6" stroke="#D07A3B" stroke-width="0.9" stroke-opacity=".7"></line><line x1="399.0" y1="152.0" x2="431.0" y2="152.0" stroke="#D07A3B" stroke-width="0.9" stroke-opacity=".7"></line><line x1="443.0" y1="100" x2="443.0" y2="152" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#el_ah)" marker-end="url(#el_ah)"></line><text x="449.0" y="130" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="currentColor">≈ 0.4 D</text><text x="320" y="242" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">비균일 응력 : Type A · B 는 20 단계</text><text x="320" y="258" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">5.13 mm 로제트면 <tspan font-family="IBM Plex Mono, monospace">0.05 mm</tspan> 씩</text><text x="320" y="274" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" 