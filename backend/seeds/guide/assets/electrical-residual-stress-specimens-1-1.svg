<svg viewBox="0 0 920 450" role="img" aria-label="가드 전극이 표면 누설과 프린징을 걷어내는 원리, 그리고 절연파괴강도의 두께 의존성" style="width:100%;height:auto;overflow:visible"><defs><marker id="el_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="el_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="26" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">전기 시험에서 측정량은 <tspan font-weight="600">전극–시편–전극 조립체</tspan>의 저항 또는 정전용량이다 — <tspan fill="#C4402B">시편이 아니라 전극이 물성을 정한다</tspan></text><rect x="200.0" y="150" width="200.0" height="34.0" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".8" stroke-width="1.4"></rect><rect x="224.0" y="141" width="152.0" height="9" fill="#C4402B" fill-opacity=".55" stroke="#C4402B" stroke-width="1"></rect><rect x="200.0" y="141" width="12.0" height="9" fill="#2F6FC4" fill-opacity=".45" stroke="#2F6FC4" stroke-width="1"></rect><rect x="388.0" y="141" width="12.0" height="9" fill="#2F6FC4" fill-opacity=".45" stroke="#2F6FC4" stroke-width="1"></rect><rect x="200.0" y="184.0" width="200.0" height="9" fill="#C4402B" fill-opacity=".55" stroke="#C4402B" stroke-width="1"></rect><line x1="232.0" y1="150" x2="232.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="249.0" y1="150" x2="249.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="266.0" y1="150" x2="266.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="283.0" y1="150" x2="283.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="300.0" y1="150" x2="300.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="317.0" y1="150" x2="317.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="334.0" y1="150" x2="334.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="351.0" y1="150" x2="351.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><line x1="368.0" y1="150" x2="368.0" y2="184.0" stroke="#C4402B" stroke-width="1" stroke-opacity=".55" stroke-dasharray="3 3"></line><path d="M222.0,150 Q204.0,167.0 206.0,184.0" fill="none" stroke="#2F6FC4" stroke-width="1.1" stroke-dasharray="3 3"></path><path d="M378.0,150 Q396.0,167.0 394.0,184.0" fill="none" stroke="#2F6FC4" stroke-width="1.1" stroke-dasharray="3 3"></path><text x="300" y="134" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">① 측정(가드된) 전극  D₁</text><text x="404.0" y="136" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#2F6FC4">③ 가드링</text><text x="300" y="208.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">② 대향 전극</text><line x1="414.0" y1="150" x2="414.0" y2="184.0" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#el_ah)" marker-end="url(#el_ah)"></line><text x="420.0" y="171.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">t</text><text x="200.0" y="234.0" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="currentColor" fill-opacity=".7">② 와 ③ 의 <tspan font-weight="600">역할을 바꾸면</tspan> 같은 지그가 체적저항 측정에서 표면저항 측정으로 바뀐다</text><text x="200.0" y="254.0" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">즉 시편이 아니라 지그가 “어떤 물성인지”를 정한다</text><text x="200.0" y="282.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">유효면적 A = π (D₁ + B·g)² / 4 &nbsp; · &nbsp; B ≈ 0.34 (g/t ≈ 2)</text><text x="200.0" y="300.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">유효둘레 P = π (D₁ + g) &nbsp; · &nbsp; ρ_s = (P / g) · R_s</text><text x="200.0" y="326.0" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">D257 대형 세트 D₃ 100 · D₂ 88 · D₁ 76 mm (g = 6) · 소형 D₃ 50 · D₂ 38 · D₁ 25 mm (g = 6.5)</text><rect x="600" y="74" width="280" height="200" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"></rect><line x1="628.0" y1="74" x2="628.0" y2="274" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="628.0" y="292" text-anchor="middle" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">0.1</text><line x1="698.0" y1="74" x2="698.0" y2="274" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="698.0" y="292" text-anchor="middle" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">0.32</text><line x1="768.0" y1="74" x2="768.0" y2="274" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="768.0" y="292" text-anchor="middle" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">1</text><line x1="838.0" y1="74" x2="838.0" y2="274" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="838.0" y="292" text-anchor="middle" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">3.2</text><line x1="600" y1="263.5" x2="880" y2="263.5" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="591" y="267.5" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">3</text><line x1="600" y1="210.8" x2="880" y2="210.8" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="591" y="214.8" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">10</text><line x1="600" y1="158.2" x2="880" y2="158.2" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="591" y="162.2" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">32</text><line x1="600" y1="105.6" x2="880" y2="105.6" stroke="currentColor" stroke-opacity=".13" stroke-width="1"></line><text x="591" y="109.6" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">100</text><text x="880.0" y="310" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">시편 두께 t [mm]</text><text x="600" y="64" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">절연파괴강도 [kV/mm]</text><polyline points="600.00,89.79 602.83,90.85 605.66,91.92 608.48,92.98 611.31,94.04 614.14,95.11 616.97,96.17 619.80,97.23 622.63,98.30 625.45,99.36 628.28,100.42 631.11,101.49 633.94,102.55 636.77,103.61 639.60,104.68 642.42,105.74 645.25,106.80 648.08,107.86 650.91,108.93 653.74,109.99 656.57,111.05 659.39,112.12 662.22,113.18 665.05,114.24 667.88,115.31 670.71,116.37 673.54,117.43 676.36,118.50 679.19,119.56 682.02,120.62 684.85,121.69 687.68,122.75 690.51,123.81 693.33,124.88 696.16,125.94 698.99,127.00 701.82,128.07 704.65,129.13 707.47,130.19 710.30,131.26 713.13,132.32 715.96,133.38 718.79,134.45 721.62,135.51 724.44,136.57 727.27,137.64 730.10,138.70 732.93,139.76 735.76,140.83 738.59,141.89 741.41,142.95 744.24,144.02 747.07,145.08 749.90,146.14 752.73,147.21 755.56,148.27 758.38,149.33 761.21,150.40 764.04,151.46 766.87,152.52 769.70,153.59 772.53,154.65 775.35,155.71 778.18,156.78 781.01,157.84 783.84,158.90 786.67,159.96 789.49,161.03 792.32,162.09 795.15,163.15 797.98,164.22 800.81,165.28 803.64,166.34 806.46,167.41 809.29,168.47 812.12,169.53 814.95,170.60 817.78,171.66 820.61,172.72 823.43,173.79 826.26,174.85 829.09,175.91 831.92,176.98 834.75,178.04 837.58,179.10 840.40,180.17 843.23,181.23 846.06,182.29 848.89,183.36 851.72,184.42 854.55,185.48 857.37,186.55 860.20,187.61 863.03,188.67 865.86,189.74 868.69,190.80 871.52,191.86 874.34,192.93 877.17,193.99 880.00,195.05" fill="none" stroke="#C4402B" stroke-width="2.3"></polyline><text x="614.0" y="172.9" text-anchor="start" fill="#C4402B" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">≈ t ^(−1/2)</text><circle cx="628.0" cy="100.3" r="4.2" fill="#D07A3B"></circle><text x="636.4" y="97.2" text-anchor="start" fill="#D07A3B" font-size="10" font-family="IBM Plex Sans KR, sans-serif">0.1 mm 필름</text><circle cx="838.7" cy="179.3" r="4.2" fill="#D07A3B"></circle><text x="782.0" y="196.1" text-anchor="start" fill="#D07A3B" font-size="10" font-family="IBM Plex Sans KR, sans-serif">3.2 mm 판</text><text x="600" y="338" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="currentColor" fill-opacity=".7">D149 원문: “두께를 밝히지 않은 절연파괴강도 값을</text><text x="600" y="356" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="currentColor" fill-opacity=".7">보고하는 것은 <tspan font-weight="600">무의미하다</tspan>”</text><text x="600" y="382" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">같은 수지의 3.2 mm 판과 0.1 mm 필름이</text><text x="600" y="400" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">kV/mm 로 한 자릿수 차이날 수 있다</text><text x="600" y="426" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">파괴는 극값(최약결함) 현상 — 두꺼울수록 결함 체적이 크다</text></svg>