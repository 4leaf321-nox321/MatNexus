          <line x1="660" y1="60" x2="740" y2="140"></line><line x1="640" y1="60" x2="720" y2="140"></line>
        </g>
        <g stroke="currentColor" stroke-opacity=".55" stroke-width="1.2">
          <path d="M300,44 V36 H500 V44" fill="none"></path>
          <line x1="400" y1="36" x2="400" y2="28"></line>
        </g>
        <g stroke="currentColor" stroke-opacity=".55" stroke-width="1.2" marker-start="url(#dm)" marker-end="url(#dm)">
          <line x1="300" y1="172" x2="500" y2="172"></line>
          <line x1="250" y1="200" x2="550" y2="200"></line>
          <line x1="520" y1="82" x2="520" y2="118"></line>
        </g>
