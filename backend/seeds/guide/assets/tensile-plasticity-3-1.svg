          <text x="105" y="168" text-anchor="middle">그립부</text>
          <text x="695" y="168" text-anchor="middle">그립부</text>
          <text x="400" y="218" text-anchor="middle">표점거리 L₀ (예: 50 또는 80 mm) · 평행부 Lc · 폭 b₀ · 두께 a₀</text>
          <text x="400" y="238" text-anchor="middle">파단이 L₀ 바깥에서 일어나면 그 시험은 무효</text>
