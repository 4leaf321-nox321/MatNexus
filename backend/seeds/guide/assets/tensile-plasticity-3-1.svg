          <line x1="250" y1="122" x2="250" y2="204"></line><line x1="550" y1="122" x2="550" y2="204"></line>
        </g>
        <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="currentColor">
          <text x="400" y="168" text-anchor="middle">L₀</text>
          <text x="400" y="196" text-anchor="middle">Lc</text>
          <text x="532" y="104">b₀</text>
        </g>
        <g font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor" fill-opacity=".62">
