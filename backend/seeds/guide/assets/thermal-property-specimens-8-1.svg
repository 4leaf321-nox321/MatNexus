<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="ASTM D648 은 세워서 굽히고 ISO 75 는 눕혀서 굽힌다 — 같은 재료가 다른 값을 준다" style="width:100%;height:auto;overflow:visible"><defs><marker id="th_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="th_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="28" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">같은 재료 · 사실상 같은 응력(1.82 vs 1.80 MPa)인데 값이 다르다 — <tspan fill="#C4402B">물성이 아니라는 증거</tspan></text><rect x="132.01999999999998" y="128.41" width="235.96" height="43.18" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".85" stroke-width="1.6"></rect><rect x="132.01999999999998" y="128.41" width="235.96" height="5" fill="#D07A3B" fill-opacity=".5"></rect><rect x="132.01999999999998" y="166.59" width="235.96" height="5" fill="#D07A3B" fill-opacity=".5"></rect><path d="M156.01999999999998,171.59 l9,18 l-18,0 Z" fill="currentColor" fill-opacity=".34" stroke="none"></path><path d="M343.98,171.59 l9,18 l-18,0 Z" fill="currentColor" fill-opacity=".34" stroke="none"></path><line x1="250" y1="82.41" x2="250" y2="120.41" stroke="#C4402B" stroke-width="2.2" marker-end="url(#th_ah)"></line><line x1="156.01999999999998" y1="211.59" x2="343.98" y2="211.59" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#th_ah)" marker-end="url(#th_ah)"></line><text x="250" y="227.59" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="currentColor">스팬 101.6 mm · 굽힘 깊이 12.7 mm</text><text x="250" y="72.41" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" font-weight="500" fill="currentColor">ASTM D648 · 세워서 (edgewise)</text><text x="250" y="251.59" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">127 × 13 × 3–13 mm · 0.455 / 1.82 MPa · 처짐 0.25 mm</text><text x="250" y="269.59000000000003" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">2 ± 0.2 °C/min</text><rect x="596.8" y="143.2" width="166.4" height="13.6" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".85" stroke-width="1.6"></rect><rect x="596.8" y="143.2" width="166.4" height="5" fill="#2F6FC4" fill-opacity=".5"></rect><rect x="596.8" y="151.8" width="166.4" height="5" fill="#2F6FC4" fill-opacity=".5"></rect><path d="M620.8,156.8 l9,18 l-18,0 Z" fill="currentColor" fill-opacity=".34" stroke="none"></path><path d="M739.2,156.8 l9,18 l-18,0 Z" fill="currentColor" fill-opacity=".34" stroke="none"></path><line x1="680" y1="97.19999999999999" x2="680" y2="135.2" stroke="#C4402B" stroke-width="2.2" marker-end="url(#th_ah)"></line><line x1="620.8" y1="196.8" x2="739.2" y2="196.8" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#th_ah)" marker-end="url(#th_ah)"></line><text x="680" y="212.8" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="currentColor">스팬 64 mm · 굽힘 깊이 4 mm</text><text x="680" y="87.19999999999999" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" font-weight="500" fill="currentColor">ISO 75-2 · 눕혀서 (flatwise)</text><text x="680" y="236.8" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">80 × 10 × 4 mm · 0.45 / 1.80 / 8.00 MPa · 굽힘변형률 0.2 %</text><text x="680" y="254.8" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">120 ± 10 °C/h · 2013년 개정에서 edgewise 삭제</text><text x="62" y="300" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">색칠한 층이 사출 <tspan fill="#D07A3B">배향 스킨</tspan> — 어느 면이 최외곽 섬유가 되는지가 달라진다</text><text x="62" y="326" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">01</text><text x="92" y="326" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">응력이 시험이 정한 값</text><text x="262" y="326" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62"> — 1.82 → 0.455 MPa 로 바꾸면 HDT 가 20–60 °C 오른다</text><text x="62" y="356" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">02</text><text x="92" y="356" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">승온속도가 고정</text><text x="206" y="356" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62"> — 점탄성 현상이므로 속도가 값의 일부 — ISO 306 은 A50·B50·A120·B120 로 이름에 박아 둔다</text><text x="62" y="386" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">03</text><text x="92" y="386" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">기하 의존</text><text x="163" y="386" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62"> — 유리충전 그레이드는 flatwise/edgewise 가 같은 판에서 10–30 °C 차이</text><text x="62" y="416" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">04</text><text x="92" y="416" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">받아 줄 구성식이 없다</text><text x="262" y="416" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62"> — *HDT 키워드도 MP,HDT 도 존재하지 않는다 — 솔버가 할 일이 없다</text></svg>