 font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">시험 시간이 임계값의 일부</text><text x="568" y="347" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">E1681: 겉보기 임계값은 <tspan font-weight="600">시험 지속시간의 함수</tspan>다</text><text x="96" y="410" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="currentColor" fill-opacity=".7">K_ISCC 는 재료의 성질이 아니라 <tspan font-weight="600">재료–환경–온도–전위 계</tspan>의 성질이다 — 환경을 바꾸면 옮길 수 없다</text></svg>