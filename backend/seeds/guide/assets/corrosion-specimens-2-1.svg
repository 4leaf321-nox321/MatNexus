<svg viewBox="0 0 920 470" role="img" aria-label="유벤드 씨링 굽힘보 직접인장 예균열 이중보의 응력 부여 방식과 응력을 아는가 모르는가" style="width:100%;height:auto;overflow:visible"><defs><marker id="co_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="co_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="26" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">이 규격들이 정하는 것은 <tspan font-weight="600">기계적 구동력을 어떻게 만들고 얼마나 정확히 아는가</tspan>다 — 환경은 <tspan fill="#C4402B">별도 규격</tspan>이 정한다</text><path d="M102,166 L102,114 A38,38 0 0 1 178,114 L178,166" fill="none" stroke="currentColor" stroke-opacity=".85" stroke-width="7"></path><line x1="94" y1="154" x2="186" y2="154" stroke="#D07A3B" stroke-width="2.4"></line><circle cx="94" cy="154" r="4" fill="#D07A3B"></circle><circle cx="186" cy="154" r="4" fill="#D07A3B"></circle><text x="194" y="158" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">절연 볼트</text><text x="140" y="96" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#C4402B">ε ≈ T / 2R</text><text x="140" y="196" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">① U벤드 (G30)</text><text x="140" y="213" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">L 80–510 · W 9–25 · T 0.8–13 · R 4.8–76 mm</text><text x="140" y="231" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">응력을 모른다 — 순위만</text><path d="M400,78 A42,42 0 1 0 430,149" fill="none" stroke="currentColor" stroke-opacity=".85" stroke-width="8"></path><line x1="402" y1="76" x2="434" y2="150" stroke="#D07A3B" stroke-width="2.4"></line><text x="440" y="112" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">볼트</text><text x="304" y="122" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#2F6FC4">Δ = f π D² / (4 E t Z)</text><text x="400" y="196" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">② C링 (G38)</text><text x="400" y="213" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">OD ≥ 16 mm · 곡선보 계수 Z 필수</text><text x="400" y="231" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#2F6FC4">탄성한도 아래면 응력 계산 가능</text><rect x="616" y="96" width="168" height="8" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.5"></rect><path d="M630,105 l7,14 l-14,0 Z" fill="currentColor" fill-opacity=".38" stroke="none"></path><path d="M770,105 l7,14 l-14,0 Z" fill="currentColor" fill-opacity=".38" stroke="none"></path><line x1="700" y1="66" x2="700" y2="92" stroke="#C4402B" stroke-width="2.2" marker-end="url(#co_ah)"></line><text x="800" y="104" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">3점</text><rect x="616" y="146" width="168" height="8" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.5"></rect><path d="M630,155 l7,14 l-14,0 Z" fill="currentColor" fill-opacity=".38" stroke="none"></path><path d="M770,155 l7,14 l-14,0 Z" fill="currentColor" fill-opacity=".38" stroke="none"></path><line x1="670" y1="116" x2="670" y2="142" stroke="#C4402B" stroke-width="2.2" marker-end="url(#co_ah)"></line><line x1="730" y1="116" x2="730" y2="142" stroke="#C4402B" stroke-width="2.2" marker-end="url(#co_ah)"></line><text x="800" y="154" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">4점</text><text x="616" y="182" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#2F6FC4">σ = 6Ety/H² (3점) · 12Ety/(3H²−4A²) (4점)</text><text x="700" y="202" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">③ 굽힘보 (G39)</text><text x="700" y="219" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">폭 25–51 · 길이 127–254 mm</text><text x="700" y="237" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#2F6FC4">4점만 균일 모멘트 · 3점은 하중점이 크레비스</text><path d="M84,311 h34 q10,0 10,-5 v-3 h24 v3 q0,5 10,5 h34 v18 h-34 q-10,0 -10,5 v3 h-24 v-3 q0,-5 -10,-5 h-34 Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.5"></path><line x1="40" y1="320" x2="78" y2="320" stroke="#C4402B" stroke-width="2.2" marker-start="url(#co_ah)"></line><line x1="202" y1="320" x2="240" y2="320" stroke="#C4402B" stroke-width="2.2" marker-end="url(#co_ah)"></line><text x="140" y="372" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">④ 직접인장 (G49)</text><text x="140" y="389" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">균일 · 단축 · 정확히 아는 응력</text><text x="140" y="407" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#2F6FC4">유일하게 진짜 임계응력 σ_th 를 준다</text><path d="M310,316 L480,298 L480,308 L310,319 Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.5"></path><path d="M310,324 L480,342 L480,332 L310,321 Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.5"></path><rect x="314" y="306" width="14" height="28" fill="#D07A3B" fill-opacity=".7"></rect><text x="314" y="298" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">웨지/볼트</text><line x1="390" y1="320" x2="480" y2="320" stroke="#C4402B" stroke-width="2.2"></line><text x="416" y="312" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#C4402B">균열</text><text x="400" y="372" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">⑤ 예균열 이중보 (G168 · E1681)</text><text x="400" y="389" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">정변위 → K 감소 → 균열 정지 · 정하중 → K 증가</text><text x="400" y="407" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#2F6FC4">K_ISCC — 개시항이 없어 가장 보수적</text><text x="612" y="256" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">⑥ 하중 이력이 결론을 바꾼다</text><text x="612" y="272" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">정변형은 균열이 자라며 하중을 흘려 <tspan font-weight="600">정지</tspan>시킨다</text><rect x="646" y="282" width="214" height="104" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"></rect><text x="860.0" y="422" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">시간 · 균열 성장</text><polyline points="646.00,308.96 648.16,308.96 650.32,308.96 652.48,308.95 654.65,308.93 656.81,308.91 658.97,308.89 661.13,308.86 663.29,308.83 665.45,308.79 667.62,308.74 669.78,308.69 671.94,308.63 674.10,308.56 676.26,308.49 678.42,308.42 680.59,308.33 682.75,308.24 684.91,308.15 687.07,308.05 689.23,307.94 691.39,307.82 693.56,307.70 695.72,307.57 697.88,307.43 700.04,307.28 702.20,307.13 704.36,306.97 706.53,306.81 708.69,306.64 710.85,306.46 713.01,306.27 715.17,306.07 717.33,305.87 719.49,305.66 721