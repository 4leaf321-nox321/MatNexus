<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="확산계수와 밀도와 비열의 곱으로 열전도율을 구할 때의 불확도 전파" style="width:100%;height:auto;overflow:visible"><defs><marker id="th_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="th_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="28" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">플래시법의 “열전도율”은 <tspan fill="#C4402B">측정된 적이 없다</tspan> — 세 측정값의 곱이다</text><rect x="62" y="62" width="178" height="74" rx="3" fill="none" stroke="#2F6FC4" stroke-width="1.5"></rect><text x="151.0" y="88" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13.5" font-weight="500" fill="currentColor">α  확산계수</text><text x="151.0" y="106" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">ASTM E1461 · ISO 22007-4</text><text x="151.0" y="125" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#2F6FC4">u = 3 – 5 %</text><rect x="284" y="62" width="178" height="74" rx="3" fill="none" stroke="#5D6BC6" stroke-width="1.5"></rect><text x="373.0" y="88" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13.5" font-weight="500" fill="currentColor">ρ  밀도</text><text x="373.0" y="106" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">아르키메데스 + CTE 보정</text><text x="373.0" y="125" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5D6BC6">u = 0.5 – 1 %</text><rect x="506" y="62" width="178" height="74" rx="3" fill="none" stroke="#8E63AE" stroke-width="1.5"></rect><text x="595.0" y="88" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13.5" font-weight="500" fill="currentColor">c_p  비열</text><text x="595.0" y="106" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">ASTM E1269 · ISO 11357-4</text><text x="595.0" y="125" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#8E63AE">u = 3 – 5 %</text><text x="250" y="107" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="currentColor" fill-opacity=".55">×</text><text x="472" y="107" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="currentColor" fill-opacity=".55">×</text><text x="694" y="107" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="currentColor" fill-opacity=".55">=</text><rect x="718" y="62" width="178" height="74" rx="3" fill="#C4402B" fill-opacity=".09" stroke="#C4402B" stroke-width="1.6"></rect><text x="807.0" y="88" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13.5" font-weight="500" fill="currentColor">k  열전도율</text><text x="807.0" y="106" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">CAE 카드에 들어가는 값</text><text x="807.0" y="125" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#C4402B">u = 4 – 9 %</text><text x="62" y="196" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="currentColor">( u_k / k )² = ( u_α / α )² + ( u_ρ / ρ )² + ( u_c / c )²</text><text x="54" y="236" text-anchor="end" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor">최선</text><rect x="62" y="224" width="129" height="16" fill="#2F6FC4" fill-opacity=".55"></rect><text x="199" y="237" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2F6FC4">4.3 %  (k=1σ)</text><text x="54" y="266" text-anchor="end" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor">전형</text><rect x="62" y="254" width="213" height="16" fill="#D07A3B" fill-opacity=".55"></rect><text x="283" y="267" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#D07A3B">7.1 %  (k=1σ)</text><text x="54" y="296" text-anchor="end" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor">최악</text><rect x="62" y="284" width="261" height="16" fill="#C4402B" fill-opacity=".55"></rect><text x="331" y="297" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4402B">8.7 %  (k=1σ)</text><text x="62" y="366" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="currentColor" fill-opacity=".66">95 % 신뢰구간으로는 <tspan font-weight="600">±10 – 18 %</tspan> — 직접 측정(E1225 · E1530 · C177 · TPS)은 이 곱을 피한다</text><rect x="520" y="187" width="7" height="7" fill="#C4402B"></rect><text x="536" y="196" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">두께 오차가 2배로 증폭</text><text x="536" y="214" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">α ∝ L² 이므로 u_L/L 1 % → u_α/α 2 %</text><rect x="520" y="231" width="7" height="7" fill="#C4402B"></rect><text x="536" y="240" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">밀도는 온도 보정 필요</text><text x="536" y="258" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">ρ(T) ≈ ρ₀(1 − 3 α_L ΔT) — 강 800 K 에서 2.9 %</text><rect x="520" y="275" width="7" height="7" fill="#C4402B"></rect><text x="536" y="284" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">세 시편이 서로 다른 재료</text><text x="536" y="302" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">다공·스킨코어면 α·ρ 와 c_p 가 다른 영역을 본다</text><rect x="520" y="319" width="7" height="7" fill="#C4402B"></rect><text x="536" y="328" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">이방성이면 k 는 텐서</text><text x="536" y="346" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">면내/두께방향 두 번 측정 — c_p 와 ρ 는 공통</text></svg>