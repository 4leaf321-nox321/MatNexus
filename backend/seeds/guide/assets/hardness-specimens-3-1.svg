<svg viewBox="0 0 920 400" role="img" aria-label="압입 아래 소성역이 바닥, 옆면, 이웃 압흔에 닿지 않아야 한다는 세 규칙" style="width:100%;height:auto;overflow:visible"><defs><marker id="hd_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="hd_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="26" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor" fill-opacity=".62">경도 규격은 시편 <tspan font-weight="600">형상</tspan>을 정하지 않는다 — 대신 <tspan fill="#C4402B">세 방향의 거리</tspan>를 정한다</text><rect x="150" y="96" width="620" height="150" fill="currentColor" fill-opacity=".10" stroke="none"></rect><line x1="150" y1="96" x2="770" y2="96" stroke="currentColor" stroke-opacity=".75" stroke-width="1.8"></line><line x1="150" y1="246" x2="770" y2="246" stroke="currentColor" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="6 4"></line><text x="780" y="251" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">anvil (지지대)</text><path d="M277,96 A78,78 0 0 0 433,96 Z" fill="#D07A3B" fill-opacity=".14" stroke="#D07A3B" stroke-width="1.1" stroke-dasharray="4 3"></path><path d="M325,96 L355,130 L385,96 Z" fill="var(--bg,#EDEFEC)" stroke="#C4402B" stroke-width="2"></path><path d="M472,96 A78,78 0 0 0 628,96 Z" fill="#D07A3B" fill-opacity=".14" stroke="#D07A3B" stroke-width="1.1" stroke-dasharray="4 3"></path><path d="M520,96 L550,130 L580,96 Z" fill="var(--bg,#EDEFEC)" stroke="#C4402B" stroke-width="2"></path><text x="269" y="166" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#D07A3B">소성역</text><line x1="730" y1="96" x2="730" y2="246" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#hd_ah)" marker-end="url(#hd_ah)"></line><text x="736" y="176" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">t ≥ 10 h</text><line x1="399" y1="96" x2="399" y2="130" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#hd_ah)" marker-end="url(#hd_ah)"></line><text x="405" y="126" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">h</text><line x1="325" y1="80" x2="385" y2="80" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#hd_ah)" marker-end="url(#hd_ah)"></line><text x="355" y="74" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="currentColor">d</text><line x1="355" y1="50" x2="550" y2="50" stroke="#C4402B" stroke-width="1.3" marker-start="url(#hd_ah)" marker-end="url(#hd_ah)"></line><text x="452.5" y="44" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#C4402B">중심간 ≥ 3 d</text><line x1="150" y1="214" x2="355" y2="214" stroke="#2F6FC4" stroke-width="1.3" marker-start="url(#hd_ah)" marker-end="url(#hd_ah)"></line><text x="252.5" y="208" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#2F6FC4">모서리 ≥ 2.5 d</text><line x1="150" y1="96" x2="150" y2="246" stroke="currentColor" stroke-opacity=".75" stroke-width="1.8"></line><rect x="60" y="300" width="8" height="8" fill="#C4402B"></rect><text x="78" y="308" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">바닥에 닿으면</text><text x="78" y="327" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">anvil 이 하중을 나눠 받아 → 경도가 높게 나온다</text><rect x="350" y="300" width="8" height="8" fill="#2F6FC4"></rect><text x="368" y="308" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">옆면에 가까우면</text><text x="368" y="327" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">재료가 옆으로 밀려 나가 → 경도가 낮게 나온다</text><rect x="640" y="300" width="8" height="8" fill="#D07A3B"></rect><text x="658" y="308" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">이웃 압흔에 겹치면</text><text x="658" y="327" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">가공경화 + 잔류응력 → 경도가 높게 나온다</text><text x="60" y="362" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor" fill-opacity=".7">세 규칙은 모두 하나의 물리에서 나온다 — <tspan font-weight="600">소성역 반경 ≈ 접촉반경의 2~3배</tspan>. 그래서 배수(10 h · 3 d · 2.5 d)가 규격마다 거의 같다.</text></svg>