762,358" fill="none" stroke="currentColor" stroke-opacity=".8" stroke-width="2"></path><rect x="686" y="316" width="76" height="7" fill="#C4402B" fill-opacity=".55" stroke="none"></rect><line x1="762" y1="276" x2="762" y2="254" stroke="#C4402B" stroke-width="2.2" marker-end="url(#ad_ah)"></line><line x1="762" y1="364" x2="762" y2="386" stroke="#C4402B" stroke-width="2.2" marker-end="url(#ad_ah)"></line><text x="774" y="272" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">T-필 (D1876)</text><text x="734" y="392" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">⑥ 필 시험</text><text x="734" y="409" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">D1876 T-필 · D903 180° · D6862 90°</text><text x="734" y="426" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">세 값은 서로 비교 불가</text><text x="60" y="452" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="currentColor" fill-opacity=".66">필 속도도 규격마다 다르다 — D1876 254 mm/min, D903 152.4 mm/min · 필 결과의 대부분은 <tspan font-weight="600">피착체를 소성 굽히는 에너지</tspan>이지 접착제의 파괴에너지가 아니다</text></svg>