<svg viewBox="0 0 920 470" role="img" aria-label="겹치기, 노치형, 후피착체, 이중겹침, DCB, 필 시험의 형상 비교" style="width:100%;height:auto;overflow:visible"><defs><marker id="ad_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="ad_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><text x="30" y="26" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">각 패널 안의 피착체 두께는 <tspan font-weight="600">서로 같은 척도</tspan> (3 px = 1 mm) — D1002 의 1.62 mm 와 D5656 의 9.53 mm 대비가 이 시험들의 전부다</text><rect x="57.0" y="113.1" width="120.0" height="4.9" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.4"></rect><rect x="138.9" y="118.0" width="120.0" height="4.9" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.4"></rect><rect x="138.9" y="116.4" width="38.1" height="3.2" fill="#C4402B" fill-opacity=".55" stroke="none"></rect><line x1="138.9" y1="99.1" x2="177.1" y2="99.1" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#ad_ah)" marker-end="url(#ad_ah)"></line><text x="158" y="88" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="currentColor">12.7</text><text x="158" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">① ASTM D1002 · 단일 겹침</text><text x="158" y="187" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">피착체 1.62 ± 0.125 mm · 금속-금속</text><text x="158" y="204" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">회전이 크다 → 끝단 필링 지배</text><rect x="357.1" y="113.1" width="120.0" height="4.9" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.4"></rect><rect x="438.9" y="118.0" width="120.0" height="4.9" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.4"></rect><rect x="438.9" y="116.4" width="38.1" height="3.2" fill="#C4402B" fill-opacity=".55" stroke="none"></rect><rect x="436.6" y="112.1" width="4.8" height="6.9" fill="var(--bg,#EDEFEC)"></rect><rect x="436.6" y="117.0" width="4.8" height="6.9" fill="var(--bg,#EDEFEC)"></rect><rect x="474.7" y="112.1" width="4.8" height="6.9" fill="var(--bg,#EDEFEC)"></rect><rect x="474.7" y="117.0" width="4.8" height="6.9" fill="var(--bg,#EDEFEC)"></rect><rect x="436.6" y="112.1" width="4.8" height="5.9" fill="var(--bg,#EDEFEC)" stroke="#D07A3B" stroke-width="1"></rect><rect x="474.7" y="118.0" width="4.8" height="5.9" fill="var(--bg,#EDEFEC)" stroke="#D07A3B" stroke-width="1"></rect><line x1="438.9" y1="99.1" x2="477.1" y2="99.1" stroke="currentColor" stroke-opacity=".55" stroke-width="1" marker-start="url(#ad_ah)" marker-end="url(#ad_ah)"></line><text x="458" y="88" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="currentColor">12.7 ± 0.3</text><text x="458" y="170" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="currentColor">② ASTM D3165 · 노치형 적층</text><text x="458" y="187" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">노치 폭 1.6 mm · 겹침을 기계가공으로 정의</text><text x="458" y="204" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">산포는 줄지만 여전히 이음 시험</text><rect x="674.0" y="89.4" width="102.0" height="28.6" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="