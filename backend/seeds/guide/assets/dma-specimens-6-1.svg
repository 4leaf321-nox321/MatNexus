<svg viewBox="0 0 880 300" role="img" aria-label="이중 캔틸레버에서 클램프 스팬과 실제 필요한 시편 블랭크 길이의 차이" style="width:100%;height:auto;overflow:visible"><defs><marker id="dm_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="dm_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><rect x="90" y="96" width="620" height="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-opacity=".85" stroke-width="1.6"></rect><rect x="90" y="85" width="26" height="38" fill="currentColor" fill-opacity=".45" stroke="none"></rect><rect x="387" y="85" width="26" height="38" fill="currentColor" fill-opacity=".45" stroke="none"></rect><rect x="684" y="85" width="26" height="38" fill="currentColor" fill-opacity=".45" stroke="none"></rect><line x1="400" y1="56" x2="400" y2="80" stroke="#C4402B" stroke-width="2" marker-end="url(#dm_ah)"></line><line x1="116" y1="142" x2="387" y2="142" stroke="#2F6FC4" stroke-width="1.2" marker-start="url(#dm_ah)" marker-end="url(#dm_ah)"></line><text x="251.5" y="136" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2F6FC4">17.5 mm</text><line x1="413" y1="142" x2="684" y2="142" stroke="#2F6FC4" stroke-width="1.2" marker-start="url(#dm_ah)" marker-end="url(#dm_ah)"></line><text x="548.5" y="136" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2F6FC4">17.5 mm</text><line x1="116" y1="172" x2="684" y2="172" stroke="#2F6FC4" stroke-width="1.2" marker-start="url(#dm_ah)" marker-end="url(#dm_ah)"></line><text x="400.0" y="166" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#2F6FC4">클램프 스팬 = 35 mm  (장비 사양에 적힌 값)</text><line x1="90" y1="208" x2="710" y2="208" stroke="#C4402B" stroke-width="1.2" marker-start="url(#dm_ah)" marker-end="url(#dm_ah)"></line><text x="400.0" y="202" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#C4402B">실제 필요한 블랭크 길이 ≈ 55 mm</text><text x="90" y="66" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="currentColor" fill-opacity=".62">회색 = 클램프 물림부 (각 ~10 mm)</text><text x="420" y="64" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#C4402B">가진</text><text x="712" y="108" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">폭 ≤ 15 mm</text><text x="712" y="124" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">두께 ≤ 5 mm</text><text x="40" y="274" font-family="IBM Plex Sans KR, sans-serif" font-size="12" fill="currentColor" fill-opacity=".78">“35 mm 이중 캔틸레버”는 시편 길이가 아니라 <tspan font-weight="500">바깥 클램프 사이 거리</tspan>입니다 — 물림 여유를 더해 블랭크를 잘라야 합니다.</text></svg>