<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="이중선형 응력-분리 법칙의 각 파라미터가 어느 시험에서 나오는가" style="width:100%;height:auto;overflow:visible"><defs><marker id="ad_ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path></marker><marker id="ad_as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"></path></marker></defs><rect x="96" y="66" width="380" height="250" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"></rect><text x="476.0" y="352" text-anchor="end" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">분리 δ</text><text x="6" y="58" fill="currentColor" fill-opacity=".62" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, monospace">트랙션 T</text><polygon points="96.00,316.00 156.80,116.00 422.80,316.00 422.80,316.00 156.80,316.00 96.00,316.00" fill="#2F6FC4" fill-opacity=".12" stroke="none"></polygon><polyline points="96.00,316.00 156.80,116.00 422.80,316.00" fill="none" stroke="#2F6FC4" stroke-width="2.4"></polyline><circle cx="156.8" cy="116.0" r="4.4" fill="#2F6FC4"></circle><line x1="96" y1="116" x2="157" y2="116" stroke="currentColor" stroke-opacity=".3" stroke-width="1" stroke-dasharray="4 3"></line><text x="107.4" y="104.0" text-anchor="start" fill="#2F6FC4" font-size="10.5" font-family="IBM Plex Sans KR, sans-serif">T_max  ← D5656 τ_max (전단) · 법선은 보정</text><text x="210.0" y="248.0" text-anchor="start" fill="#D07A3B" font-size="11" font-family="IBM Plex Sans KR, sans-serif">면적 = G_c  ← ISO 25217 · D5528 · D7905</text><text x="103.6" y="284.0" text-anchor="start" fill="currentColor" fill-opacity=".65" font-size="10.5" font-family="IBM Plex Sans KR, sans-serif">기울기 K = G / 접착층 두께</text><text x="157" y="334" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="currentColor">δ₀</text><text x="423" y="334" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="currentColor">δ_f</text><text x="96" y="30" font-family="IBM Plex Sans KR, sans-serif" font-size="12" font-weight="500" fill="currentColor">δ_f = 2 G_c / T &#160;— 에너지와 변위 중 <tspan fill="#C4402B">하나만</tspan> 주면 된다 (둘 다 주면 카드가 모순된다)</text><text x="96" y="352" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">법선 강도 T_n 에는 깨끗한 시험 규격이 없다</text><text x="96" y="370" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".66">D897 butt 은 접착층 0.025 mm 로 구속이 너무 심하다</text><text x="96" y="386" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".66">실무에서 T_n 은 측정이 아니라 <tspan font-weight="600">교정</tspan>된다</text><text x="96" y="406" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".66">G_c 도 τ–γ 도 <tspan font-weight="600">접착층 두께 의존</tspan> — 본드라인이 다르면 그대로 옮길 수 없다</text><text x="540" y="74" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="#2F6FC4">Abaqus</text><text x="540" y="94" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">*DAMAGE INITIATION, CRITERION=QUADS</text><text x="540" y="108" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">T_n · T_s · T_t  ← D5656 + 교정</text><text x="540" y="124" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">*DAMAGE EVOLUTION, TYPE=ENERGY,</text><text x="540" y="138" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">  MIXED MODE BEHAVIOR=BK, POWER=η</text><text x="540" y="154" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">  G_Ic, G_IIc, G_IIIc</text><text x="540" y="168" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">← ISO 25217 · D5528 · D7905 · η ← D6671</text><text x="540" y="190" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="#C4402B">LS-DYNA</text><text x="540" y="210" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">*MAT_COHESIVE_MIXED_MODE (MAT_138)</text><text x="540" y="224" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">EN · ET · GIC · GIIC</text><text x="540" y="240" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">XMU · T · S · UND · UTD</text><text x="540" y="254" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">에너지와 극한변위를 둘 다 주면 모순된다</text><text x="540" y="276" font-family="IBM Plex Sans KR, sans-serif" font-size="12.5" font-weight="500" fill="#8E63AE">Ansys</text><text x="540" y="296" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">TB,CZM   TBOPT=CBDE</text><text x="540" y="310" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">σ_max · G_cn · τ_max · G_ct · η · β · α</text><text x="540" y="326" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="currentColor" fill-opacity=".85">TBOPT=CBDD 는 분리거리로 정의</text><text x="540" y="340" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".6">혼합모드는 지수 α 의 멱함수 법칙</text><text x="540" y="368" font-family="IBM Plex Sans KR, sans-serif" font-size="11" fill="#C4402B">혼합모드 지수는 네 코드가 서로 다른 법칙이다</text><text x="540" y="386" font-family="IBM Plex Sans KR, sans-serif" font-size="10.5" fill="currentColor" fill-opacity=".62">Abaqus BK · Abaqus POWER LAW · LS-DYNA XMU · Ansys α — 숫자를 복사하지 말 것</text></svg>